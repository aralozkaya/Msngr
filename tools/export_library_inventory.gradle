// Run with: ./gradlew -I tools/export_library_inventory.gradle :app:exportLibraryAudit
// This resolves both shipped APK graphs and their POMs, not instrumentation/build tools.
import groovy.json.JsonOutput
import org.gradle.maven.MavenModule
import org.gradle.maven.MavenPomArtifact
import org.gradle.api.artifacts.result.ResolvedArtifactResult

gradle.projectsEvaluated {
    def app = gradle.rootProject.project(':app')
    app.tasks.register('exportLibraryAudit') {
        doLast {
            def configurations = ['release', 'debug'].collectEntries { [(it):app.configurations.getByName(it+'RuntimeClasspath')] }
            def components = configurations.values().collectMany { it.incoming.resolutionResult.allComponents.collect { it.id } }
                .findAll { it instanceof org.gradle.api.artifacts.component.ModuleComponentIdentifier }
            def poms = [:]
            app.dependencies.createArtifactResolutionQuery().forComponents(components)
                .withArtifacts(MavenModule, MavenPomArtifact).execute().resolvedComponents.each { component ->
                    component.getArtifacts(MavenPomArtifact).each { artifact ->
                        if (artifact instanceof ResolvedArtifactResult) poms[component.id.toString()] = artifact.file.absolutePath
                    }
                }
            def rows = [:]
            configurations.each { variant, configuration ->
                configuration.resolvedConfiguration.resolvedArtifacts.each {
                    def id = it.moduleVersion.id.toString()
                    def row = rows.computeIfAbsent(id) { ignored ->
                        [group:it.moduleVersion.id.group, name:it.moduleVersion.id.name,
                         version:it.moduleVersion.id.version, file:it.file.absolutePath,
                         pom:poms[id], variants:[]]
                    }
                    if (!row.variants.contains(variant)) row.variants.add(variant)
                }
            }
            def values = rows.values().sort { a,b -> "${a.group}:${a.name}:${a.version}" <=> "${b.group}:${b.name}:${b.version}" }
            def output = new File(app.layout.buildDirectory.get().asFile, 'reports/licenses/android-runtime.json')
            output.parentFile.mkdirs()
            output.text = JsonOutput.prettyPrint(JsonOutput.toJson(values))+'\n'
            println "Resolved ${values.size()} release/debug runtime components."
        }
    }
}
