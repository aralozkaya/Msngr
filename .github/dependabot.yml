version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: daily
    open-pull-requests-limit: 10
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
  - package-ecosystem: gitsubmodule
    directory: /
    schedule:
      interval: daily
    # Ruffle needs its matching published JS/WASM bundle. update-ruffle.yml
    # updates both the stable source commit and verified assets in one PR.
    allow:
      - dependency-name: third_party/libsiren
    open-pull-requests-limit: 5
