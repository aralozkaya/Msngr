name: Auto-merge dependency updates

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_run:
    workflows: [Android CI, Dependency security]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: dependency-auto-merge-${{ github.event.pull_request.head.ref || github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  enable:
    if: >-
      (github.event_name == 'pull_request_target' &&
       (github.event.pull_request.user.login == 'dependabot[bot]' ||
        github.event.pull_request.user.login == 'github-actions[bot]')) ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
      checks: read
    steps:
      # This is a privileged workflow: execute only the protected default branch.
      # Never check out the PR, download its artifacts, or initialize submodules.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Enable auto-merge after successful build and vulnerability checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/auto_merge_dependencies.py
