name: Build release APKs

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Version to validate (vMAJOR.MINOR.PATCH or a supported prerelease tag). Builds the selected branch without publishing.'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-apks-${{ github.event.release.id || github.ref }}
  cancel-in-progress: false

jobs:
  dependency-security:
    uses: ./.github/workflows/dependency-security.yml

  build-and-package:
    name: Build and package APKs
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out the release or validation revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          submodules: true

      - name: Set up Java 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'platforms;android-37.0 build-tools;36.0.0 ndk;28.2.13676358 cmake;3.22.1'
          log-accepted-android-sdk-licenses: false

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Test and build both variants
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        run: bash ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleRelease :app:assembleDebug

      - name: Prepare APKs and checksums
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: bash .github/scripts/package-apks.sh

      - name: Upload packaged APKs and checksums
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-apks
          path: ${{ runner.temp }}/release-apks/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Attach verified APKs to the release
    if: ${{ github.event_name == 'release' }}
    needs: [dependency-security, build-and-package]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download verified APKs and checksums
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-apks
          path: ${{ runner.temp }}/release-apks/
      - name: Verify downloaded checksums
        working-directory: ${{ runner.temp }}/release-apks
        run: sha256sum --check SHA256SUMS.txt
      - name: Attach files to the published release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release upload --repo "$GITHUB_REPOSITORY" --clobber -- \
            "$RELEASE_TAG" \
            "$RUNNER_TEMP/release-apks/"*.apk \
            "$RUNNER_TEMP/release-apks/SHA256SUMS.txt"
